# Статика RedPen. Файлы приезжают из общего тома (content-sync + publisher API).
#
# Зачем этот файл вообще: у образа nginx по умолчанию нет `Cache-Control`, и
# браузер кэширует эвристически — обычно 10 % от возраста файла. После выкладки
# читатель мог неделями сидеть на старом JS и не видеть ни новых замечаний,
# ни цветов категорий. Имена файлов не содержат хэша, поэтому единственный
# честный вариант — обязательная ревалидация; ETag превращает её в дешёвый 304.
server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML страниц: перерисовывается на каждую правку через редактор.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Код и стили: без хэша в имени, значит ревалидировать обязательно.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Замечания: меняются на каждую правку.
    location ~* /remarks/.*\.json$ {
        add_header Cache-Control "no-cache";
    }

    # `annotations` — прежнее имя того же каталога. Каталог удалён с тома в
    # фазе 6 переименования (2026-08-30), но адреса из него разошлись по
    # закладкам и уже розданным офлайн-копиям; переадресуем навсегда.
    location ~* ^/(?<doc>[^/]+)/annotations/(?<rest>.+)$ {
        return 301 /$doc/remarks/$rest;
    }

    # Сканы страниц и прочая тяжёлая неизменная статика — можно и подержать.
    location ~* \.(png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
