<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Мединский.нет — переезд в /work/</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
  <p>Редактор переехал в <a id="go" href="../work/">рабочее место</a>.</p>
  <script>
    // Адрес карточки переносится один в один: закладки на конкретные
    // замечания разошлись по переписке, и ломать их незачем. Заглушка
    // временная — её снимут отдельно, после периода привыкания.
    (function () {
      var target = '../work/' + window.location.search + (window.location.hash || '');
      document.getElementById('go').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
