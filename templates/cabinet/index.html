<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Мединский.нет — переезд в /work/</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
</head>
<body>
  <p>Кабинет переехал в <a id="go" href="../work/#/remarks">рабочее место</a>.</p>
  <script>
    // Вкладки кабинета в адресе не отражались, переносить нечего: ведём на
    // сквозной список замечаний — с него кабинет и открывался.
    (function () {
      var target = '../work/' + window.location.search + '#/remarks';
      document.getElementById('go').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
