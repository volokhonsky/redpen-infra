[pytest]
# Default test discovery for the RedPen pure-Python + API suites.
testpaths = tests
python_files = test_*.py

# The Playwright end-to-end scripts (annotation_position_tests.py,
# editor_mode_tests.py, simple_test.py, reproduce_404.py) are intentionally NOT
# named test_*.py so they are excluded from the default run. They require a
# browser and a published site; run them manually (see tests/README.md).

filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore:.*on_event is deprecated.*:DeprecationWarning
